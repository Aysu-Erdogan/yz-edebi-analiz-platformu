name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Biçim kontrolü
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run format:check

  backend:
    name: Backend (tip, lint, test, derleme, migration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: yz_edebi_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql://root:ci_root_password@127.0.0.1:3306/yz_edebi_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      # Migration dosyalarının gerçek MySQL'de hatasız uygulandığını doğrular.
      - run: npx prisma migrate deploy

  frontend:
    name: Frontend (tip, lint, test, derleme)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build

  docker:
    name: Docker Compose (derleme ve açılış)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Uçtan uca sağlık kontrolü (arayüz üzerinden API)
        run: |
          curl --fail --silent --show-error http://localhost:8080/api/v1/health
          curl --fail --silent --show-error http://localhost:8080/ | grep -q "YZ Edebi Analiz"
      - name: Başarısızlıkta günlükler
        if: failure()
        run: docker compose logs --no-color
      - run: docker compose down --volumes
