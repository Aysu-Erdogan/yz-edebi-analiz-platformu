server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Üretim yapılarındaki dosya adları içerik özetli, uzun süre önbelleğe alınabilir.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # API istekleri backend kapsayıcısına yönlendirilir (uzun üretim işleri için geniş zaman aşımı).
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 120s;
  }

  # React Router: bilinmeyen yollarda index.html döner.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "no-referrer" always;
}
