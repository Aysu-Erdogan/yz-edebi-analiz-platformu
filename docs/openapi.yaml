openapi: 3.1.0
info:
  title: YZ Edebi Analiz Platformu API
  version: 0.1.0
  description: |
    Üretken yapay zekâ modellerinin Türkçe edebi metinlerini rubrik temelli üreten, puanlayan ve karşılaştıran API.

    **Durum:** Bu belge hedef sözleşmedir (F0 taslağı). Her uçta `x-status` alanı vardır:
    `implemented` (kodda çalışıyor) ya da `planned` (ilgili fazda yazılacak).

    **Zarf:** Tüm yanıtlar `{ success: true, data }` ya da `{ success: false, error }` biçimindedir.
    Hata kodları sabittir ve istemci bunlara göre davranabilir.
servers:
  - url: http://localhost:3000/api/v1
    description: Yerel geliştirme (doğrudan backend)
  - url: http://localhost:8080/api/v1
    description: Docker Compose (nginx üzerinden)
# Varsayılan: okuma uçları açıktır. Yazma uçları `security` ile yönetici girişi ister.
security: []
tags:
  - name: Sistem
    description: Sağlık ve yapılandırma bilgisi
  - name: Rubrik
    description: Rubrik yönetimi (sürümlü, kullanıldıktan sonra değişmez)
  - name: Üretim
    description: Model çağrıları, toplu işler ve metin kütüphanesi
  - name: Değerlendirme
    description: Rubrik temelli puanlama ve karşılaştırma
  - name: Analiz
    description: Özet, istatistik ve dışa aktarım
  - name: Kimlik
    description: Yönetici girişi

paths:
  /health:
    get:
      tags: [Sistem]
      summary: Sağlık kontrolü
      description: Süreç ve veritabanı durumu. Veritabanı yanıt vermezse 503 döner.
      x-status: implemented
      operationId: getHealth
      responses:
        '200':
          description: Sistem çalışıyor
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Health' }
        '503':
          $ref: '#/components/responses/Error'

  /models:
    get:
      tags: [Sistem]
      summary: Yapılandırılmış YZ modelleri
      description: Anahtarı tanımlı olan sağlayıcıların aktif modelleri.
      x-status: planned
      operationId: listModels
      responses:
        '200':
          description: Model listesi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ProviderModel' }

  /rubrics:
    get:
      tags: [Rubrik]
      summary: Rubrikleri listele
      x-status: planned
      operationId: listRubrics
      parameters:
        - name: genre
          in: query
          schema: { $ref: '#/components/schemas/Genre' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/RubricStatus' }
      responses:
        '200':
          description: Rubrik listesi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Rubric' }
  /rubrics/{id}:
    get:
      tags: [Rubrik]
      summary: Rubrik ayrıntısı (kriterler ve düzeyler)
      x-status: planned
      operationId: getRubric
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Rubrik
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Rubric' }
        '404':
          $ref: '#/components/responses/Error'
  /rubrics/import:
    post:
      tags: [Rubrik]
      summary: Rubrik JSON'unu içe aktar (taslak olarak)
      description: Şema ve ağırlık doğrulaması yapılır. Yönetici yetkisi gerekir.
      x-status: planned
      operationId: importRubric
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RubricInput' }
      responses:
        '201':
          description: Oluşturuldu
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /rubrics/{id}/activate:
    post:
      tags: [Rubrik]
      summary: Rubriği etkinleştir
      description: Aynı türdeki önceki etkin rubrik arşivlenir.
      x-status: planned
      operationId: activateRubric
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Etkinleştirildi
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /generations:
    post:
      tags: [Üretim]
      summary: Toplu üretim (ve isteğe bağlı puanlama) işi başlat
      description: Model, tür ve tema kombinasyonları için iş oluşturur. İş arka planda çalışır.
      x-status: planned
      operationId: createGenerationJob
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenerationRequest' }
      responses:
        '202':
          description: İş kuyruğa alındı
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          jobId: { type: integer }
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
    get:
      tags: [Üretim]
      summary: Üretimleri listele
      x-status: planned
      operationId: listGenerations
      parameters:
        - { name: genre, in: query, schema: { $ref: '#/components/schemas/Genre' } }
        - { name: theme, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/RunStatus' } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Üretim listesi
  /jobs/{id}:
    get:
      tags: [Üretim]
      summary: İş durumu ve ilerleme
      x-status: planned
      operationId: getJob
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: İş
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Job' }
        '404':
          $ref: '#/components/responses/Error'

  /texts:
    get:
      tags: [Üretim]
      summary: Metin kütüphanesi
      description: |
        Süzgece uyan metinleri kimliğe göre artan sırada, **gövdesiz özet** olarak verir (sözcük sayısı ve ilk
        160 karakter); gövde ve puanlamalar `GET /texts/{id}` ucundadır. Yalnızca okur; yönetici girişi
        (F4) gelene kadar herkese açıktır.
      x-status: implemented
      operationId: listTexts
      parameters:
        - { name: genre, in: query, schema: { $ref: '#/components/schemas/Genre' } }
        - { name: theme, in: query, schema: { type: string, minLength: 1, maxLength: 32 } }
        - { name: source, in: query, schema: { type: string, enum: [generated, manual] } }
      responses:
        '200':
          description: Metin listesi (eşleşme yoksa boş liste)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          required: [id, genre, theme, source, wordCount, excerpt, succeededEvaluations]
                          properties:
                            id: { type: integer }
                            genre: { $ref: '#/components/schemas/Genre' }
                            theme: { type: string }
                            source: { type: string, enum: [generated, manual] }
                            label: { type: [string, 'null'], description: Elle girilen metinde kullanıcının etiketi }
                            author:
                              type: [object, 'null']
                              description: Üretilen metnin yazarı (üretim kaydındaki model); elle girilende boş
                              properties:
                                provider: { type: string }
                                modelId: { type: string }
                                displayName: { type: string }
                            wordCount: { type: integer }
                            excerpt: { type: string }
                            createdAt: { type: string, format: date-time }
                            succeededEvaluations: { type: integer, description: Başarılı puanlama sayısı (tüm hakemler, tekrarlar dahil) }
        '400':
          $ref: '#/components/responses/Error'
    post:
      tags: [Üretim]
      summary: Elle metin ekle
      x-status: planned
      operationId: createText
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [genre, theme, body]
              properties:
                genre: { $ref: '#/components/schemas/Genre' }
                theme: { type: string, maxLength: 32 }
                body: { type: string, minLength: 1, maxLength: 20000 }
                label: { type: string, maxLength: 128, description: Model etiketi (ör. ChatGPT) }
      responses:
        '201':
          description: Oluşturuldu
        '400':
          $ref: '#/components/responses/Error'

  /texts/{id}:
    get:
      tags: [Üretim]
      summary: Metin ayrıntısı (gövde, üretim bilgisi ve tüm puanlamalar)
      description: |
        Puanlamalar kimliğe göre sıralıdır; her birinde hakem, rubrik ve komut sürümü, tekrar no, durum ve
        kriter puanları (rubrik sırasıyla, kriter adı ve gerekçesiyle) bulunur. Başarısız puanlamada puan
        satırı yoktur, `error` doludur. Elle girilen metinde `author` ve `generation` boştur.
      x-status: implemented
      operationId: getText
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Metin
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [id, genre, theme, source, body, wordCount, evaluations]
                        properties:
                          id: { type: integer }
                          genre: { $ref: '#/components/schemas/Genre' }
                          theme: { type: string }
                          source: { type: string, enum: [generated, manual] }
                          label: { type: [string, 'null'] }
                          author:
                            type: [object, 'null']
                            properties:
                              provider: { type: string }
                              modelId: { type: string }
                              displayName: { type: string }
                          body: { type: string }
                          wordCount: { type: integer }
                          createdAt: { type: string, format: date-time }
                          succeededEvaluations: { type: integer }
                          generation:
                            type: [object, 'null']
                            properties:
                              templateVersion: { type: string }
                              replicateNo: { type: integer }
                              inputTokens: { type: [integer, 'null'] }
                              outputTokens: { type: [integer, 'null'] }
                              latencyMs: { type: [integer, 'null'] }
                          evaluations:
                            type: array
                            items:
                              type: object
                              properties:
                                id: { type: integer }
                                judge: { type: string, example: deepseek/deepseek-flash }
                                rubricVersion: { type: string }
                                templateVersion: { type: [string, 'null'] }
                                replicateNo: { type: integer }
                                status: { type: string }
                                error: { type: [string, 'null'] }
                                totalScore: { type: [number, 'null'], description: 'Ağırlıklı toplam, 0-100' }
                                createdAt: { type: string, format: date-time }
                                scores:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      key: { type: string }
                                      label: { type: string }
                                      score: { type: number, description: Ham puan (rubrik ölçeğinde) }
                                      comment: { type: [string, 'null'] }
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /evaluations:
    post:
      tags: [Değerlendirme]
      summary: Metin(leri) rubrikle puanla
      description: |
        Yargıç model metni kör (model adı verilmeden) puanlar. Geçersiz çıktı bir kez yeniden denenir,
        yine geçersizse kayıt `failed` olur. Uydurma puan yazılmaz.
      x-status: planned
      operationId: createEvaluation
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvaluationRequest' }
      responses:
        '202':
          description: İş kuyruğa alındı
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
    get:
      tags: [Değerlendirme]
      summary: Değerlendirmeleri listele
      x-status: planned
      operationId: listEvaluations
      parameters:
        - { name: textId, in: query, schema: { type: integer } }
        - { name: rubricId, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/RunStatus' } }
      responses:
        '200':
          description: Değerlendirme listesi
  /comparisons:
    post:
      tags: [Değerlendirme]
      summary: Üç metni yan yana karşılaştır
      description: |
        Metinler "elle girilen" olarak kaydedilir (model analizine girmez), her biri sistemin tek sabit hakemiyle
        (`DEFAULT_JUDGE`, varsayılan `deepseek-flash`) etkin rubrikle ayrı puanlanır. Hakem etiketi ve model adını
        görmez. GERÇEK, ÜCRETLİ çağrı yapar; yönetici girişi ve hız sınırı F4'te gelene kadar herkese açıktır.
        Biri puanlanamazsa o öğe `failed` döner, diğerlerinin sonucu korunur.
        Hakem, sağlayıcı anahtarı ya da etkin rubrik yoksa hiçbir kayıt açılmadan 503 / 404 döner.
      x-status: implemented
      operationId: compareTexts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [genre, theme, items]
              properties:
                genre: { $ref: '#/components/schemas/Genre' }
                theme: { type: string, minLength: 1, maxLength: 32 }
                items:
                  type: array
                  minItems: 2
                  maxItems: 3
                  items:
                    type: object
                    additionalProperties: false
                    required: [body]
                    properties:
                      label: { type: string, maxLength: 128, description: Metni yazan modelin etiketi (örn. ChatGPT) }
                      body: { type: string, minLength: 1, maxLength: 20000 }
      responses:
        '200':
          description: Karşılaştırma sonucu (öğeler istek sırasıyla)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [genre, theme, judge, rubric, items, totalCostUsd]
                        properties:
                          genre: { $ref: '#/components/schemas/Genre' }
                          theme: { type: string }
                          judge: { type: string, example: deepseek/deepseek-flash }
                          rubric:
                            type: object
                            properties:
                              id: { type: integer }
                              version: { type: string }
                              scale:
                                type: object
                                properties:
                                  min: { type: integer }
                                  max: { type: integer }
                              criteria:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    key: { type: string }
                                    label: { type: string }
                                    weight: { type: number }
                          items:
                            type: array
                            items:
                              type: object
                              required: [label, textId, status]
                              properties:
                                label: { type: [string, 'null'] }
                                textId: { type: integer }
                                status: { type: string, enum: [succeeded, failed] }
                                totalScore: { type: number, description: 'Ağırlıklı toplam, 0-100 (yalnızca succeeded)' }
                                scores:
                                  type: array
                                  description: Yalnızca succeeded
                                  items:
                                    type: object
                                    properties:
                                      key: { type: string }
                                      score: { type: integer, description: Ham puan (rubrik ölçeğinde) }
                                      normalized: { type: number, description: 0-100 karşılığı }
                                      comment: { type: string }
                                costUsd: { type: [number, 'null'], description: Yalnızca succeeded }
                                error: { type: string, description: Yalnızca failed }
                          totalCostUsd: { type: [number, 'null'] }
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'

  /analytics/summary:
    get:
      tags: [Analiz]
      summary: Model, tür ve tema bazında betimsel özet
      x-status: planned
      operationId: getAnalyticsSummary
      responses:
        '200':
          description: Özet
  /analytics/stats:
    get:
      tags: [Analiz]
      summary: Model karşılaştırması (betimsel değerler, Kruskal-Wallis, Mann-Whitney) ve kriter profili
      description: >
        Ölçüm birimi metindir (tekrarlar ortalanır); hakem, rubrik ve komut sürümü ayrı koşuldur.
        `kirilimlar` tüm türler, tür ve tema bazında betimsel değerleri, `karsilastirmalar`
        Kruskal-Wallis ve ikili Mann-Whitney sonuçlarını (Holm düzeltmeli, Cliff δ), `profiller`
        radar grafiği için türe göre yazar başına kriter ortalamalarını verir. Eşik ya da
        "anlamlı" yargısı yoktur, ham değerler döner.
      x-status: implemented
      operationId: getAnalyticsStats
      parameters:
        - name: tema
          in: query
          required: false
          description: Virgülle ayrılmış temalar; verilmezse tüm temalar (deneme verisi dahil).
          schema: { type: string }
      responses:
        '200':
          description: >
            `{ success, data: { olusturulma, kosullar: [{ hakem, rubrikSurumu, hakemKomutSurumu,
            metin, elleGirilen, olculemeyen, kirilimlar, karsilastirmalar, profiller }] } }`
        '400':
          $ref: '#/components/responses/Error'
  /export:
    get:
      tags: [Analiz]
      summary: Veriyi dışa aktar
      description: >
        Dosya olarak iner (`puanlar.csv` ya da `puanlar.json`). CSV UTF-8 BOM ile, kriter başına bir
        satır; JSON metin ve hakem gerekçeleriyle tam kayıt. Her kayıtta rubrik notu (taslak uyarısı)
        bulunur. Başarılı yanıt zarfsızdır (dosya gövdesi).
      x-status: implemented
      operationId: exportData
      parameters:
        - name: format
          in: query
          required: true
          schema: { type: string, enum: [csv, json] }
      responses:
        '200':
          description: Dosya
          content:
            text/csv: { schema: { type: string } }
            application/json: { schema: { type: object } }
        '400':
          $ref: '#/components/responses/Error'

  /auth/login:
    post:
      tags: [Kimlik]
      summary: Yönetici girişi
      x-status: planned
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: Giriş başarılı (httpOnly çerez ayarlanır)
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
  responses:
    Error:
      description: Hata (sabit kodlu)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    SuccessEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: {}
    ErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - BAD_JSON
                - PAYLOAD_TOO_LARGE
                - UNAUTHORIZED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - RATE_LIMITED
                - SERVICE_UNAVAILABLE
                - INTERNAL_ERROR
            message: { type: string }
            details: {}
            requestId:
              type: string
              description: Günlükte eşleştirme için. Yanıt başlığında `X-Request-Id` olarak da döner.
    Health:
      type: object
      required: [status, version, uptimeSeconds, checks]
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string }
        uptimeSeconds: { type: integer }
        checks:
          type: object
          properties:
            database: { type: string, enum: [up, down, unconfigured] }
    Genre:
      type: string
      enum: [siir, hikaye, deneme]
    RubricStatus:
      type: string
      enum: [draft, active, archived]
    RunStatus:
      type: string
      enum: [pending, running, succeeded, failed]
    ProviderModel:
      type: object
      properties:
        id: { type: integer }
        provider: { type: string, enum: [openai, anthropic, google, mock] }
        modelId: { type: string }
        displayName: { type: string }
        active: { type: boolean }
    RubricLevel:
      type: object
      required: [score, descriptor]
      properties:
        score: { type: integer }
        descriptor: { type: string }
    RubricCriterion:
      type: object
      required: [key, label, description, weight, levels]
      properties:
        key: { type: string, pattern: '^[a-zA-Z][a-zA-Z0-9]*$' }
        label: { type: string }
        description: { type: string }
        weight: { type: number, exclusiveMinimum: 0 }
        levels:
          type: array
          items: { $ref: '#/components/schemas/RubricLevel' }
    RubricInput:
      type: object
      required: [genre, version, scale, criteria]
      properties:
        genre: { $ref: '#/components/schemas/Genre' }
        version: { type: string, examples: ['0.1-taslak'] }
        sourceNote: { type: string, examples: ['GEÇİCİ TASLAK: uzman doğrulaması yok'] }
        scale:
          type: object
          required: [min, max]
          properties:
            min: { type: integer }
            max: { type: integer }
        criteria:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/RubricCriterion' }
    Rubric:
      allOf:
        - $ref: '#/components/schemas/RubricInput'
        - type: object
          properties:
            id: { type: integer }
            status: { $ref: '#/components/schemas/RubricStatus' }
            usedAt: { type: [string, 'null'], format: date-time }
    GenerationRequest:
      type: object
      required: [modelIds, genres, themes]
      properties:
        modelIds:
          type: array
          items: { type: integer }
          minItems: 1
        genres:
          type: array
          items: { $ref: '#/components/schemas/Genre' }
          minItems: 1
        themes:
          type: array
          items: { type: string }
          minItems: 1
        replicates: { type: integer, minimum: 1, maximum: 10, default: 1 }
        evaluate: { type: boolean, default: true, description: Üretimden sonra puanla }
        judgeModelIds:
          type: array
          items: { type: integer }
        experimentName: { type: string }
        dryRun:
          type: boolean
          default: false
          description: Çağrı yapmadan tahmini token ve maliyeti döndürür.
    EvaluationRequest:
      type: object
      required: [textIds, rubricId, judgeModelIds]
      properties:
        textIds: { type: array, items: { type: integer }, minItems: 1 }
        rubricId: { type: integer }
        judgeModelIds: { type: array, items: { type: integer }, minItems: 1 }
        replicates: { type: integer, minimum: 1, maximum: 5, default: 1 }
    Job:
      type: object
      properties:
        id: { type: integer }
        type: { type: string }
        status: { $ref: '#/components/schemas/RunStatus' }
        total: { type: integer }
        done: { type: integer }
        failed: { type: integer }
        error: { type: [string, 'null'] }
